# 微信助手 (dsh-wechat-allsessions)：默认自动发现全部未归档对话并广播
- id: dsh-wechat-allsessions
  name: dsh-wechat-allsessions
  config:
    enabled: true
    broadcastAll: true
    defaultUserId: ''    activeBotId: ''  # 可选指定微信收发账号，保存后重启 Host
    maxChunkBytes: 1500
    routeStorePath: ''
    accountConfigPath: ''
    statePath: ''
    includeSessionHint: true
    includeInternal: true
    includeSubagents: true
    format: plain
    sendLogLimit: 20
